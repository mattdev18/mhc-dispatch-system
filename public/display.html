<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Live TV Queue Display - May Harvest Corporation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/display.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/audio.js"></script>
</head>
<body class="display-screen">

    <!-- TV Header -->
    <header class="tv-header">
        <div class="tv-brand">
            <div class="tv-logo-box">
                <img src="/images/mhc-logo.png" alt="May Harvest Corporation">
            </div>
            <div class="tv-title">
                <h1>MAY HARVEST CORPORATION</h1>
                <h2>LIVE TRUCK DISPATCH &amp; QUEUE BOARD</h2>
            </div>
        </div>
        <div class="tv-header-right">
            <div class="tv-controls-group">
                <button class="tv-ctrl-btn" id="soundBtn" onclick="toggleSound()" title="Enable Voice Announcement for Truckers">
                    🔊 Audio: Off
                </button>
                <select id="tvVoiceSelect" onchange="changeTvVoice(this.value)" class="tv-voice-select" style="display: none;">
                </select>
                <a href="/sap-tv" target="_blank" class="tv-ctrl-btn tv-btn-sap" title="Open Live SAP OTC Board">
                    🗂️ SAP BOARD ↗
                </a>
                <button class="tv-ctrl-btn tv-btn-fs" onclick="toggleTvFullscreen()" title="Toggle Fullscreen TV Mode">
                    ⛶ FULLSCREEN
                </button>
            </div>
            <div class="tv-clock-box">
                <div class="tv-clock" id="tvClock">--:--:--</div>
                <div class="tv-date" id="tvDate">--------</div>
            </div>
        </div>
    </header>

    <!-- TV Main Content Grid -->
    <main class="tv-main">

        <!-- Left: Now Serving Hero Box (Massive & High Contrast for 50ft Distance) -->
        <section class="tv-calling-panel" id="callingPanel">
            <div class="tv-calling-hdr-row">
                <div class="tv-calling-badge" id="callingBadge">NOW CALLING</div>
                <div id="callingCountBadge" style="display: none;" class="tv-call-counter-badge">📢 1st Call</div>
            </div>
            <div class="tv-calling-queue" id="callingQueue">---</div>
            <div class="tv-calling-truck" id="callingPlate">WAITING FOR CALL</div>
            <div class="tv-calling-door" id="callingDoor">PROCEED TO: ---</div>
            <div class="tv-calling-driver" id="callingDriver">Please wait for your queue number</div>
            <div class="tv-calling-load" id="callingLoad">-</div>
        </section>

        <!-- Right: 8 Loading Bays Status Grid -->
        <section class="tv-docks-panel">
            <div class="tv-panel-title">
                <div class="tv-panel-title-left">
                    <span class="tv-dock-icon">🚛</span>
                    <span>LOADING BAY DOORS (1 TO 8)</span>
                </div>
                <span class="tv-dock-summary" id="dockSummary">8 Total Doors</span>
            </div>

            <div class="tv-doors-grid" id="tvDoorsGrid">
                <!-- 8 Door Boxes Generated by JS -->
            </div>
        </section>

    </main>

    <!-- Bottom Ticker: Next in line (Continuous Marquee for Truckers in Staging) -->
    <footer class="tv-ticker">
        <div class="tv-ticker-label">
            <span class="ticker-pulse-dot"></span>
            NEXT IN LINE (QUEUE):
        </div>
        <div class="tv-ticker-track" id="tvTickerTrack">
            <div class="tv-ticker-list" id="tvTickerList">
                <span style="color: #64748b;">No other waiting trucks in queue.</span>
            </div>
        </div>
    </footer>

    <script src="/js/display.js"></script>
</body>
</html>
