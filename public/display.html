<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live TV Queue Display - May Harvest Corporation</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/display.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/audio.js"></script>
</head>
<body class="display-screen">

    <!-- TV Header -->
    <header class="tv-header">
        <div class="tv-brand">
            <div class="tv-logo-box">
                <img src="/images/mhc-logo.png" alt="May Harvest Corporation">
            </div>
            <div class="tv-title">
                <h1>MAY HARVEST CORPORATION</h1>
                <h2>LIVE TRUCK DISPATCH &amp; QUEUE BOARD</h2>
            </div>
        </div>
        <div class="tv-clock-box">
            <div class="tv-clock" id="tvClock">--:--:--</div>
            <div class="tv-date" id="tvDate">--------</div>
        </div>
    </header>

    <!-- TV Main Content Grid -->
    <main class="tv-main">

        <!-- Left: Now Serving Hero Box -->
        <section class="tv-calling-panel" id="callingPanel">
            <div class="tv-calling-badge" id="callingBadge">NOW CALLING</div>
            <div class="tv-calling-queue" id="callingQueue">---</div>
            <div class="tv-calling-truck" id="callingPlate">WAITING FOR CALL</div>
            <div class="tv-calling-door" id="callingDoor">PROCEED TO: ---</div>
            <div class="tv-calling-driver" id="callingDriver">Please wait for your queue number</div>
            <div class="tv-calling-load" id="callingLoad">-</div>
        </section>

        <!-- Right: 8 Loading Bays Status Grid -->
        <section class="tv-docks-panel">
            <div class="tv-panel-title">
                <span>🚛 Loading Bay Doors (1 to 8)</span>
                <span style="font-size: 13px; color: #4ade80;" id="dockSummary">8 Total Doors</span>
            </div>

            <div class="tv-doors-grid" id="tvDoorsGrid">
                <!-- 8 Door Boxes Generated by JS -->
            </div>
        </section>

    </main>

    <!-- Bottom Ticker: Next in line -->
    <footer class="tv-ticker">
        <div class="tv-ticker-label">NEXT IN LINE:</div>
        <div class="tv-ticker-list" id="tvTickerList">
            <span style="color: #64748b;">No other waiting trucks in queue.</span>
        </div>
    </footer>

    <!-- Audio Activation Pill -->
    <button class="tv-sound-btn" id="soundBtn" onclick="toggleSound()">
        🔊 Click to Enable Voice &amp; Chime
    </button>

    <script src="/js/display.js"></script>
</body>
</html>
