<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login - May Harvest Corporation</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        :root {
            --brand-green: #16a34a;
            --brand-green-hover: #15803d;
            --accent-green: #22c55e;
            --card-bg: rgba(15, 30, 22, 0.90);
            --card-border: rgba(74, 222, 128, 0.22);
            --input-bg: #09150f;
            --input-border: #1a3826;
            --input-text: #f8fafc;
            --text-sub: #94a3b8;
        }

        body.login-page {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 25%, #005a2b 0%, #003618 60%, #001f0e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            position: relative;
            overflow-x: hidden;
        }

        /* Subtle background texture */
        body.login-page::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(34, 197, 94, 0.08) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
        }

        .login-wrap {
            width: 100%;
            max-width: 440px;
            padding: 24px 16px;
            position: relative;
            z-index: 10;
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            border-top: 5px solid var(--accent-green);
            border-radius: 20px;
            padding: 38px 34px 28px 34px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), 0 0 40px rgba(0, 80, 35, 0.4);
            text-align: center;
            animation: cardEntrance 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardEntrance {
            0% { opacity: 0; transform: translateY(16px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .brand-heading {
            margin-bottom: 22px;
        }

        .login-logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 12px auto;
            border-radius: 16px;
            padding: 6px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.15);
        }

        .login-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .company-name {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.3px;
            margin: 0;
            line-height: 1.25;
        }

        .system-subtitle {
            font-size: 13px;
            font-weight: 800;
            color: var(--accent-green);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-top: 5px;
            margin-bottom: 8px;
            display: block;
        }

        .login-sub {
            font-size: 12.5px;
            color: var(--text-sub);
            margin: 0 0 20px 0;
            line-height: 1.45;
        }

        .login-field {
            text-align: left;
            margin-bottom: 18px;
            position: relative;
        }

        .login-field label {
            display: block;
            font-size: 11.5px;
            font-weight: 700;
            color: var(--text-sub);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon-svg {
            position: absolute;
            left: 14px;
            color: #64748b;
            width: 17px;
            height: 17px;
            pointer-events: none;
            transition: color 0.2s;
        }

        .login-field input[type="text"],
        .login-field input[type="password"] {
            width: 100%;
            height: 46px;
            padding: 0 42px 0 40px;
            border-radius: 10px;
            border: 1.5px solid var(--input-border);
            font-size: 14px;
            background: var(--input-bg);
            color: var(--input-text);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            box-sizing: border-box;
        }

        .login-field input:focus {
            background: #0d2116;
            border-color: var(--accent-green);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.25);
        }

        .login-field input:focus ~ .input-icon-svg {
            color: var(--accent-green);
        }

        /* Show/Hide password toggle */
        button.pwd-toggle-btn {
            all: unset;
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%) !important;
            width: 32px !important;
            height: 32px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            cursor: pointer !important;
            color: #64748b !important;
            border-radius: 6px !important;
            transition: color 0.15s ease, background-color 0.15s ease !important;
            z-index: 5;
        }

        button.pwd-toggle-btn:hover {
            color: #f1f5f9 !important;
            background-color: rgba(255, 255, 255, 0.08) !important;
        }

        .caps-warning {
            display: none;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            padding: 6px 10px;
            background: rgba(120, 53, 15, 0.7);
            color: #fef3c7;
            border: 1px solid #b45309;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            text-align: left;
        }

        .login-alert {
            display: none;
            background: rgba(153, 27, 27, 0.4);
            color: #fecaca;
            border: 1px solid #dc2626;
            padding: 11px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 18px;
            text-align: left;
            line-height: 1.4;
        }

        .row-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            font-size: 12.5px;
            color: var(--text-sub);
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-label input {
            accent-color: var(--brand-green);
            width: 15px;
            height: 15px;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            height: 48px;
            padding: 0 18px;
            font-size: 14.5px;
            font-weight: 700;
            letter-spacing: 0.3px;
            background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
            border: 1px solid var(--accent-green);
            border-radius: 10px;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(22, 163, 74, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-submit:hover:not(:disabled) {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            box-shadow: 0 6px 22px rgba(22, 163, 74, 0.5);
            transform: translateY(-1px);
        }

        .btn-submit:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.65s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Sleek Driver Link (Replaced informal dashed box) */
        .driver-quick-link {
            margin-top: 20px;
            padding: 11px 14px;
            background: rgba(15, 35, 23, 0.7);
            border: 1px solid rgba(34, 197, 94, 0.15);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-size: 12px;
            color: var(--text-sub);
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .driver-quick-link:hover {
            background: rgba(34, 197, 94, 0.12);
            border-color: rgba(34, 197, 94, 0.35);
            color: #f1f5f9;
        }

        .driver-quick-link span.link-text {
            color: var(--accent-green);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .login-footer {
            margin-top: 22px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 11px;
            color: #64748b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .login-footer a {
            color: var(--text-sub);
            text-decoration: none;
        }

        .login-footer a:hover {
            color: var(--accent-green);
        }
    </style>
</head>
<body class="login-page">

    <div class="login-wrap">
        <div class="login-card">
            
            <!-- Brand Logo & Header -->
            <div class="brand-heading">
                <div class="login-logo">
                    <img src="/images/mhc-logo.png" alt="May Harvest Corporation Logo">
                </div>
                <h1 class="company-name">May Harvest Corporation</h1>
                <div class="system-subtitle">DISPATCH QUEUING SYSTEM</div>
                <p class="login-sub">Please enter your authorized plant credentials to access the dispatch portal.</p>
            </div>

            <!-- Error Banner -->
            <div id="loginAlert" class="login-alert" role="alert"></div>

            <form id="loginForm" autocomplete="on">
                <!-- Username -->
                <div class="login-field">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            placeholder="Enter your username" 
                            required 
                            autocomplete="username" 
                            autofocus>
                        <svg class="input-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </div>
                </div>

                <!-- Password -->
                <div class="login-field">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Enter your password" 
                            required 
                            autocomplete="current-password">
                        <svg class="input-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <button 
                            type="button" 
                            id="togglePasswordBtn" 
                            class="pwd-toggle-btn" 
                            aria-label="Show password" 
                            title="Show/hide password" 
                            tabindex="-1">
                            <!-- Eye icon (visible password) -->
                            <svg id="eyeIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <!-- Eye-off icon (hidden password) -->
                            <svg id="eyeOffIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>

                    <!-- Caps Lock Warning -->
                    <div id="capsLockAlert" class="caps-warning" role="status">
                        <span>⚠️</span>
                        <span>Caps Lock is ON</span>
                    </div>
                </div>

                <!-- Remember Me -->
                <div class="row-meta">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe" checked>
                        <span>Remember me on this terminal</span>
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="loginBtn" class="btn-submit">
                    <span id="btnIcon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <span id="btnText">Sign In to Dispatch Station</span>
                </button>
            </form>

            <!-- Driver Self-service portal link -->
            <a href="/display" class="driver-quick-link">
                <span>Are you a truck driver?</span>
                <span class="link-text">
                    Public Queue Board
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                        <polyline points="15 3 21 3 21 9"></polyline>
                        <line x1="10" y1="14" x2="21" y2="3"></line>
                    </svg>
                </span>
            </a>

            <!-- Footer -->
            <div class="login-footer">
                <span>May Harvest Corp • v2.5.0</span>
                <a href="javascript:void(0)" onclick="alert('Authorized Staff Support: Contact Plant Dispatch Supervisor or IT Admin.')">IT Support</a>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        // Redirect if already authenticated
        if (typeof getAuthToken === 'function' && getAuthToken()) {
            const params = new URLSearchParams(window.location.search);
            const returnUrl = params.get('returnUrl') || '/dispatch';
            window.location.href = returnUrl;
        }

        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const btnIcon = document.getElementById('btnIcon');
        const btnText = document.getElementById('btnText');
        const loginAlert = document.getElementById('loginAlert');
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const eyeIcon = document.getElementById('eyeIcon');
        const eyeOffIcon = document.getElementById('eyeOffIcon');
        const capsLockAlert = document.getElementById('capsLockAlert');

        const DEFAULT_BTN_ICON_HTML = `
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        `;

        // 1. Show/Hide Password Toggle
        togglePasswordBtn.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            eyeIcon.style.display = isPassword ? 'none' : 'block';
            eyeOffIcon.style.display = isPassword ? 'block' : 'none';
            togglePasswordBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
            passwordInput.focus();
        });

        // 2. Caps Lock Warning Detector
        function checkCapsLock(e) {
            if (e && typeof e.getModifierState === 'function') {
                const isCapsOn = e.getModifierState('CapsLock');
                capsLockAlert.style.display = isCapsOn ? 'flex' : 'none';
            }
        }
        passwordInput.addEventListener('keydown', checkCapsLock);
        passwordInput.addEventListener('keyup', checkCapsLock);
        passwordInput.addEventListener('focus', checkCapsLock);
        passwordInput.addEventListener('blur', () => {
            capsLockAlert.style.display = 'none';
        });

        // 3. Form Submit with Double-click Protection & Clean Error Handling
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginAlert.style.display = 'none';

            const username = document.getElementById('username').value.trim();
            const password = passwordInput.value;
            const rememberMe = document.getElementById('rememberMe').checked;

            if (!username || !password) {
                loginAlert.style.display = 'block';
                loginAlert.textContent = 'Please enter both your username and password.';
                return;
            }

            // Set Loading State
            loginBtn.disabled = true;
            btnIcon.className = 'btn-spinner';
            btnIcon.innerHTML = '';
            btnText.textContent = 'Verifying credentials...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (!data.success) {
                    loginAlert.style.display = 'block';
                    if (res.status === 401 || (data.error && data.error.toLowerCase().includes('invalid'))) {
                        loginAlert.textContent = 'Wrong username or password. Please try again.';
                    } else {
                        loginAlert.textContent = data.error || 'Wrong username or password. Please try again.';
                    }

                    // Reset Button State
                    loginBtn.disabled = false;
                    btnIcon.className = '';
                    btnIcon.innerHTML = DEFAULT_BTN_ICON_HTML;
                    btnText.textContent = 'Sign In to Dispatch Station';
                    passwordInput.focus();
                    passwordInput.select();
                    return;
                }

                // Successful login
                btnText.textContent = 'Success! Redirecting...';
                if (typeof setAuthSession === 'function') {
                    setAuthSession(data.token, data.user, rememberMe);
                }

                const params = new URLSearchParams(window.location.search);
                const returnUrl = params.get('returnUrl') || '/dispatch';
                window.location.href = returnUrl;

            } catch (err) {
                loginAlert.style.display = 'block';
                loginAlert.textContent = 'Unable to connect to server. Please check your internet connection.';
                loginBtn.disabled = false;
                btnIcon.className = '';
                btnIcon.innerHTML = DEFAULT_BTN_ICON_HTML;
                btnText.textContent = 'Sign In to Dispatch Station';
            }
        });
    </script>
</body>
</html>
